    <circle cx="184" cy="210" r="17"/><circle cx="234" cy="210" r="17"/><circle cx="284" cy="210" r="17"/>
    <circle cx="184" cy="270" r="17"/><circle cx="234" cy="270" r="17"/><circle cx="284" cy="270" r="17"/>
    <circle cx="184" cy="330" r="17"/><circle cx="234" cy="330" r="17"/><circle cx="284" cy="330" r="17"/>
  </g>
  <circle cx="234" cy="210" r="22" fill="#4f46e5"/>
  <circle cx="284" cy="270" r="22" fill="#4f46e5"/>
  <circle cx="184" cy="330" r="22" fill="#4f46e5"/>
  <!-- the mark: a green check badge -->
