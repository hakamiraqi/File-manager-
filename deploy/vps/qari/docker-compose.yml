# Qari-OCR on trial (2026-11-11): two llama.cpp servers, 8-bit (Q8_0 GGUF) Arabic OCR models,
# only on FileNest's Docker network (no ports on the internet). Each is capped at 2 processor
# cores so the clinics, exams and FileNest stay responsive. Models live in /opt/qari/models
# (deploy/vps/qari/fetch-models.sh). Remove with: docker compose -p qari down
name: qari
services:
  qari-2b:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qari-2b
    restart: unless-stopped
    command: ["-m", "/models/qari-2b.Q8_0.gguf", "--mmproj", "/models/qari-2b.mmproj-Q8_0.gguf",
              "--host", "0.0.0.0", "--port", "8080", "-t", "2", "-c", "8192", "-np", "1",
              "--temp", "0", "--no-webui"]
    volumes: ["/opt/qari/models:/models:ro"]
    cpus: 2
    mem_limit: 4g
    networks: [filenest]
  qari-4b:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qari-4b
    restart: unless-stopped
    command: ["-m", "/models/qari-4b.Q8_0.gguf", "--mmproj", "/models/qari-4b.mmproj-F16.gguf",
              "--host", "0.0.0.0", "--port", "8080", "-t", "2", "-c", "8192", "-np", "1",
              "--temp", "0", "--no-webui"]
    volumes: ["/opt/qari/models:/models:ro"]
    cpus: 2
    mem_limit: 10g  # 7g ran out on a full page (2026-11-11)
    networks: [filenest]
networks:
  filenest:
    external: true
    name: filenest_default
