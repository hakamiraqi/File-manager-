; Shares the 4-core / 24 GB server with the dental app; a modest pool is plenty for a file manager.
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 1000
; Large ZIP downloads and file streaming can take a while.
request_terminate_timeout = 3600s
listen.backlog = 1024
