# Runs behind the Caddy HTTPS front end on the VPS (Docker network `headscale_default`).
map $request_method $filenest_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $filenest_login_key zone=filenest_login:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # One upload chunk (20 MB) plus form fields; whole files never come in one request.
    client_max_body_size 34m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The office editor (container `office`) at /office. Resolved per request, so this nginx
    # starts even while the editor is down (then /office answers 502 and the site says so).
    location ^~ /office/ {
        # The editor carries this site's own logo: its logo pictures are answered by the site.
        location ~* /(eo_logo_dark|eo_logo_light|header-logo_s|dark-logo_s|logo|logo_s|logo-white_s|logo-new|logo-new-white|logo-ios|logo-android|header-logo-ios|header-logo-android)\.(svg|png)$ {
            rewrite ^ /office-brand/logo last;
        }

        resolver 127.0.0.11 valid=30s ipv6=off;
        set $office_editor http://office-editor;
        rewrite ^/office/(.*)$ /$1 break;
        proxy_pass $office_editor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host/office;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        client_max_body_size 100m;
    }

    location = /login {
        limit_req zone=filenest_login burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    # pdf.js runs its worker from a .mjs file; browsers refuse a module with the wrong type.
    location ~* ^/build/.+\.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # App installers on /download: always saved as a file with the right type.
    location ~* ^/downloads/[^/]+\.(apk|exe|ipa|zip)$ {
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe ipa;
            application/zip zip;
        }
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        # Streaming video and building big ZIPs.
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        # Laravel's preload "Link" header lists every JS/CSS chunk of the page; the file manager has
        # many, which overflowed the default 4-8 KB header buffer (502 "upstream sent too big header").
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Caddy terminates TLS, so tell Laravel the original request was HTTPS.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(css|js|ico|png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known) { deny all; }
}
