<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Conference with Mobile Camera Switching</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.primary {
            background: linear-gradient(45deg, #4CAF50, #45a049);
        }

        .btn.danger {
            background: linear-gradient(45deg, #f44336, #d32f2f);
        }

        .btn.secondary {
            background: linear-gradient(45deg, #2196F3, #1976D2);
        }

        .camera-switch {
            background: linear-gradient(45deg, #9C27B0, #7B1FA2);
            display: none;
        }

        .camera-switch.show {
            display: block;
        }

        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .video-wrapper {
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .video-wrapper.local {
            border: 3px solid #4CAF50;
        }

        .video-wrapper.remote {
            border: 3px solid #2196F3;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .status {
            text-align: center;
            color: white;
            margin: 20px 0;
            font-size: 18px;
            font-weight: 600;
        }

        .mobile-indicator {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .mobile-indicator.show {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
            
            .video-container {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Video Conference</h1>
            <p>Real-time video conferencing with mobile camera switching</p>
        </div>

        <div class="mobile-indicator" id="mobileIndicator">
            📱 Mobile device detected - Camera switching available
        </div>

        <div class="controls">
            <button class="btn primary" id="startBtn">🚀 Start Conference</button>
            <button class="btn secondary" id="joinBtn">🔗 Join Room</button>
            <button class="btn camera-switch" id="switchCameraBtn">📷 Switch Camera</button>
            <button class="btn danger" id="stopBtn">⏹️ Stop</button>
        </div>

        <div class="status" id="status">Ready to start video conference</div>

        <div class="video-container" id="videoContainer">
            <div class="video-wrapper local" id="localVideoWrapper">
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-label">You (Local)</div>
            </div>
        </div>
    </div>

    <!-- RTCMultiConnection Library -->
    <script src="https://cdn.webrtc-experiment.com/RTCMultiConnection.js"></script>
    
    <script>
        class VideoConference {
            constructor() {
                this.connection = null;
                this.localStream = null;
                this.isMobile = this.detectMobile();
                this.currentCamera = 'environment'; // Default to back camera
                this.roomId = this.generateRoomId();
                
                this.initializeElements();
                this.bindEvents();
                this.setupConnection();
                
                if (this.isMobile) {
                    document.getElementById('mobileIndicator').classList.add('show');
                    document.getElementById('switchCameraBtn').classList.add('show');
                }
            }

            detectMobile() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            }

            generateRoomId() {
                return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            }

            initializeElements() {
                this.startBtn = document.getElementById('startBtn');
                this.joinBtn = document.getElementById('joinBtn');
                this.switchCameraBtn = document.getElementById('switchCameraBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.status = document.getElementById('status');
                this.localVideo = document.getElementById('localVideo');
                this.videoContainer = document.getElementById('videoContainer');
            }

            bindEvents() {
                this.startBtn.addEventListener('click', () => this.startConference());
                this.joinBtn.addEventListener('click', () => this.joinConference());
                this.switchCameraBtn.addEventListener('click', () => this.switchCamera());
                this.stopBtn.addEventListener('click', () => this.stopConference());
            }

            setupConnection() {
                this.connection = new RTCMultiConnection();
                
                // Configure connection
                this.connection.socketURL = 'https://rtcmulticonnection.herokuapp.com:443/';
                this.connection.socketMessageEvent = 'video-conference-demo';
                this.connection.session = {
                    audio: true,
                    video: true,
                    oneway: false
                };
                
                this.connection.sdpConstraints.mandatory = {
                    OfferToReceiveAudio: true,
                    OfferToReceiveVideo: true
                };

                // Handle incoming streams
                this.connection.onstream = (event) => {
                    this.addRemoteVideo(event.stream, event.userid);
                };

                this.connection.onstreamended = (event) => {
                    this.removeRemoteVideo(event.userid);
                };

                this.connection.onopen = () => {
                    this.updateStatus('Connected to signaling server');
                };

                this.connection.onclose = () => {
                    this.updateStatus('Disconnected from signaling server');
                };

                this.connection.onerror = (error) => {
                    this.updateStatus('Error: ' + error.message);
                };
            }

            async startConference() {
                try {
                    this.updateStatus('Starting conference...', true);
                    
                    // Get user media with camera constraints
                    const constraints = {
                        audio: true,
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: this.currentCamera
                        }
                    };

                    this.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.localVideo.srcObject = this.localStream;
                    
                    // Open room
                    this.connection.open(this.roomId);
                    
                    this.updateStatus(`Conference started! Room ID: ${this.roomId}`);
                    this.startBtn.disabled = true;
                    this.joinBtn.disabled = true;
                    this.stopBtn.disabled = false;
                    
                } catch (error) {
                    this.updateStatus('Error starting conference: ' + error.message);
                    console.error('Error starting conference:', error);
                }
            }

            async joinConference() {
                const roomId = prompt('Enter room ID to join:');
                if (!roomId) return;

                try {
                    this.updateStatus('Joining conference...', true);
                    
                    // Get user media
                    const constraints = {
                        audio: true,
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: this.currentCamera
                        }
                    };

                    this.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.localVideo.srcObject = this.localStream;
                    
                    // Join room
                    this.connection.join(roomId);
                    
                    this.updateStatus(`Joined room: ${roomId}`);
                    this.startBtn.disabled = true;
                    this.joinBtn.disabled = true;
                    this.stopBtn.disabled = false;
                    
                } catch (error) {
                    this.updateStatus('Error joining conference: ' + error.message);
                    console.error('Error joining conference:', error);
                }
            }

            async switchCamera() {
                if (!this.isMobile) return;

                try {
                    this.updateStatus('Switching camera...', true);
                    
                    // Stop current stream
                    if (this.localStream) {
                        this.localStream.getTracks().forEach(track => track.stop());
                    }

                    // Switch camera
                    this.currentCamera = this.currentCamera === 'environment' ? 'user' : 'environment';
                    
                    // Get new stream
                    const constraints = {
                        audio: true,
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: this.currentCamera
                        }
                    };

                    this.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.localVideo.srcObject = this.localStream;
                    
                    // Update connection stream
                    if (this.connection.isInitiator) {
                        this.connection.replaceTrack(this.localStream);
                    }
                    
                    const cameraName = this.currentCamera === 'environment' ? 'Back' : 'Front';
                    this.updateStatus(`Switched to ${cameraName} camera`);
                    
                } catch (error) {
                    this.updateStatus('Error switching camera: ' + error.message);
                    console.error('Error switching camera:', error);
                }
            }

            stopConference() {
                try {
                    // Stop local stream
                    if (this.localStream) {
                        this.localStream.getTracks().forEach(track => track.stop());
                        this.localStream = null;
                    }

                    // Close connection
                    if (this.connection) {
                        this.connection.close();
                    }

                    // Clear video
                    this.localVideo.srcObject = null;
                    
                    // Remove remote videos
                    const remoteVideos = document.querySelectorAll('.video-wrapper.remote');
                    remoteVideos.forEach(video => video.remove());

                    this.updateStatus('Conference stopped');
                    this.startBtn.disabled = false;
                    this.joinBtn.disabled = false;
                    this.stopBtn.disabled = true;
                    
                } catch (error) {
                    this.updateStatus('Error stopping conference: ' + error.message);
                    console.error('Error stopping conference:', error);
                }
            }

            addRemoteVideo(stream, userId) {
                const videoWrapper = document.createElement('div');
                videoWrapper.className = 'video-wrapper remote';
                videoWrapper.id = `remote-${userId}`;

                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.playsinline = true;

                const label = document.createElement('div');
                label.className = 'video-label';
                label.textContent = `Remote User (${userId})`;

                videoWrapper.appendChild(video);
                videoWrapper.appendChild(label);
                this.videoContainer.appendChild(videoWrapper);
            }

            removeRemoteVideo(userId) {
                const videoWrapper = document.getElementById(`remote-${userId}`);
                if (videoWrapper) {
                    videoWrapper.remove();
                }
            }

            updateStatus(message, loading = false) {
                this.status.innerHTML = loading ? 
                    `<span class="loading"></span> ${message}` : 
                    message;
            }
        }

        // Initialize the application when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new VideoConference();
        });

        // Handle page visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('Page hidden - consider pausing video');
            } else {
                console.log('Page visible - resuming video');
            }
        });

        // Handle beforeunload
        window.addEventListener('beforeunload', () => {
            // Clean up any active connections
            if (window.videoConference && window.videoConference.connection) {
                window.videoConference.connection.close();
            }
        });
    </script>
</body>
</html>
