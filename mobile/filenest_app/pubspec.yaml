name: filenest_app
description: "FileNest mobile client — browse, upload, download and share files from the FileNest REST API."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.3
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.0.6
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  share_plus: ^7.2.1
  qr_flutter: ^4.1.0
  video_player: ^2.9.1
  screen_brightness: ^1.0.1
  volume_controller: ^2.0.7
  # «خريطة المكتبة»: the website's 3D map (three.js) inside the app on Android, iPhone and Windows.
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2
  webview_windows: ^0.4.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
