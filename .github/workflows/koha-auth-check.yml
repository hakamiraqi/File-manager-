name: Koha spec check (read-only)
on:
  push:
    branches: [claude/project-thread-vapo01]
    paths: [.github/workflows/koha-auth-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s -m 90 http://167.86.66.47:8080/api/v1/ > spec.json
          python3 -c "
          import json; d=json.load(open('spec.json'))
          print('version', d.get('info'))
          for p,v in d['paths'].items():
              if 'biblio' in p or p.startswith('/items'): print(p, sorted(k for k in v if k!='parameters'))
          "
