name: Koha auth check (read-only)
on:
  push:
    branches: [claude/project-thread-vapo01]
    paths: [.github/workflows/koha-auth-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -s -m 60 -c jar http://167.86.66.47:8080/cgi-bin/koha/mainpage.pl > login.html
          grep -o -i -E '<meta name="generator"[^>]*>|Koha [0-9]+\.[0-9]+\.[0-9]+[^"<]*|<meta name="csrf-token"[^>]*>' login.html | head
          echo "== form"; sed -n '/<form/,/<\/form>/p' login.html | grep -o -E '<(form|input|select)[^>]*>' | sed -E 's/value="[A-Za-z0-9+\/=_-]{20,}"/value="<long>"/' | head -30
          echo "== branch options"; grep -o -E '<option[^>]*value="DENT"[^>]*>' login.html
          echo "== js"; curl -s -m 60 http://167.86.66.47:8080/cgi-bin/koha/svc/config/systempreferences 2>/dev/null | head -c 200; echo
