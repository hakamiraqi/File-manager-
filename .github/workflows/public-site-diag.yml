name: Public site check (one-off)

# Read-only look at why visitors don't see the library map or theses (2026-11-24).
on:
  push:
    branches: [claude/project-thread-wi5ba2]
    paths: ['ops/public-site/**', '.github/workflows/public-site-diag.yml']
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '16.16.76.126' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Run
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '16.16.76.126' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "sudo docker exec -i filenest-app php" < ops/public-site/diag.php
          curl -s -o /dev/null -w "map for visitors: %{http_code} -> %{redirect_url}\n" https://files.azoclinic.duckdns.org/library/map
          curl -s -o /dev/null -w "theses for visitors: %{http_code} -> %{redirect_url}\n" https://files.azoclinic.duckdns.org/theses
          curl -s -o /dev/null -w "home: %{http_code} -> %{redirect_url}\n" https://files.azoclinic.duckdns.org/
