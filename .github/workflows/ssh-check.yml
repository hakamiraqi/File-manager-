name: SSH key check (read-only)
on:
  push:
    branches: [claude/project-thread-vapo01]
    paths: [.github/workflows/ssh-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || '16.16.76.126' }}
      VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
    steps:
      - env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "host=$VPS_HOST user=$VPS_USER"
          mkdir -p ~/.ssh; printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/k; chmod 600 ~/.ssh/k
          echo "key lines: $(grep -c . ~/.ssh/k); first: $(head -1 ~/.ssh/k | cut -c1-40)"
          ssh-keygen -y -f ~/.ssh/k >/dev/null && echo "key reads OK" || echo "key does NOT parse"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -o ConnectTimeout=20 -i ~/.ssh/k "$VPS_USER@$VPS_HOST" 'echo SSH-OK; uptime' || echo SSH-FAILED
