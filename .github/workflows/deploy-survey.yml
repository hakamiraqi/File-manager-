name: Survey — test and deploy
on:
  push:
    branches: [survey]
  workflow_dispatch:
concurrency: deploy-survey
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - run: python -m unittest discover -s tests -v
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to the VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          if [ "$(grep -c . ~/.ssh/vps_key)" -le 2 ] && grep -q -- '-----BEGIN' ~/.ssh/vps_key; then
            python3 -c "import os,re;p=os.path.expanduser('~/.ssh/vps_key');t=open(p).read().strip();m=re.match(r'(-----BEGIN [A-Z ]+-----)(.*?)(-----END [A-Z ]+-----)',t,re.S);b=''.join(m.group(2).split());open(p,'w').write(m.group(1)+'\n'+'\n'.join(b[i:i+64] for i in range(0,len(b),64))+'\n'+m.group(3)+'\n')"
          fi
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          tar czf /tmp/survey.tgz app deploy
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "mkdir -p ~/survey && rm -rf ~/survey/app && tar xzf - -C ~/survey" < /tmp/survey.tgz
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd ~/survey && sh deploy/deploy.sh"
      - name: Check the site
        run: |
          for i in $(seq 20); do
            if curl -fsS https://survey.azoclinic.duckdns.org/health; then exit 0; fi
            sleep 6
          done
          echo "The site did not answer over HTTPS" >&2; exit 1
