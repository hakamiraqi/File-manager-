# One-off trial (2026-11-06): compares Tesseract and Qari-OCR on sample pages, on CPU only.
# Removed again after the trial.
name: OCR trial
on:
  push:
    branches: [claude/project-thread-2madpm]
    paths: ['ocr-trial/**', '.github/workflows/ocr-trial.yml']
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-ara >/dev/null
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers==4.49.0" "qwen-vl-utils==0.0.8" accelerate pillow
          nproc; free -g
      - name: Trial
        run: python ocr-trial/run.py
