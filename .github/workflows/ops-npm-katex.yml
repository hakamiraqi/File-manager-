name: Add KaTeX to the exam system
# One-off: this session cannot reach npm, so the package (and its lock entry) is added here
# and committed to the exams branch.
on:
  push:
    branches: [ops/npm-katex]
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exams
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add the package
        run: |
          npm install --save katex@^0.16 --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "Exams: add KaTeX (equations, rendered offline)"
          git push origin HEAD:exams
