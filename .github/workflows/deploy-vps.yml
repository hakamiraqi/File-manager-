name: Deploy to VPS

# Ships the site to https://files.azoclinic.duckdns.org on the Oracle VPS (the same server as the
# dental app, in its own folder and containers). Copies the repo over SSH and runs
# deploy/vps/deploy.sh, which backs up the database, rebuilds the Docker images, migrates, and
# adds the site to the shared Caddy the first time.
#
# Repository secret: VPS_SSH_KEY (private key of the ubuntu user, no passphrase).
# Optional: VPS_HOST (default 193.123.83.82), VPS_USER (default ubuntu).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/filenest
  SITE: https://files.azoclinic.duckdns.org

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the VPS key
        id: cfg
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY is not set on this repository (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          # A key pasted on one line (line breaks turned into spaces) is put back into PEM shape.
          if [ "$(grep -c . ~/.ssh/vps_key)" -le 2 ] && grep -q -- '-----BEGIN' ~/.ssh/vps_key; then
            python3 - <<'PY'
          import os, re
          p = os.path.expanduser('~/.ssh/vps_key')
          t = open(p).read().strip()
          m = re.match(r'(-----BEGIN [A-Z ]+-----)(.*?)(-----END [A-Z ]+-----)', t, re.S)
          if m:
              body = ''.join(m.group(2).split())
              lines = [body[i:i+64] for i in range(0, len(body), 64)]
              open(p, 'w').write(m.group(1) + '\n' + '\n'.join(lines) + '\n' + m.group(3) + '\n')
          PY
          fi
          chmod 600 ~/.ssh/vps_key
          # Shape only (never the key): helps when the secret was pasted wrong.
          echo "key lines: $(grep -c . ~/.ssh/vps_key); first: $(head -1 ~/.ssh/vps_key | cut -c1-40)"
          ssh-keygen -y -f ~/.ssh/vps_key >/dev/null && echo "key reads OK" || echo "::error::VPS_SSH_KEY is not a valid private key (paste the whole .key file, including the BEGIN and END lines)."
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Server state before deploying
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          # Containers, memory and the last log lines: shows why the site was down, if it was.
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "free -m; df -h / | tail -1; sudo docker ps -a --filter name=filenest --format '{{.Names}}  {{.Status}}'; \
            echo '== app'; sudo docker logs --since 2h filenest-app 2>&1 | grep -v ' 200 ' | tail -40; \
            echo '== web errors'; sudo docker logs --since 2h filenest-web 2>&1 | grep -E 'error|\" 50[0-9] ' | tail -30 | cut -c1-400; \
            echo '== laravel.log'; sudo docker exec filenest-app sh -c 'tail -n 30 storage/logs/laravel.log 2>/dev/null' | cut -c1-400" || true

      - name: Copy the code and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          # .env, storage and the app downloads on the server are left alone.
          tar czf /tmp/app.tgz \
            --exclude='./.git' --exclude='./.github' --exclude='./node_modules' --exclude='./vendor' \
            --exclude='./.env' --exclude='./storage' --exclude='./public/build' --exclude='./public/downloads' \
            --exclude='./public/storage' --exclude='./mobile' --exclude='./offline' --exclude='./tests' .
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR' && tar xzf - -C '$APP_DIR'" < /tmp/app.tgz
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd '$APP_DIR' && sh deploy/vps/deploy.sh" | tee /tmp/deploy.log
          # The first admin password stays in ~/filenest-admin-password.txt on the server only:
          # this repository is public, so its run summaries are too.

      - name: Check the site answers
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/login" || true)
            [ "$code" = 200 ] && { echo "Login page answers 200."; curl -s -o /dev/null -w "/download -> %{http_code}\n" "$SITE/download"; exit 0; }
            sleep 6
          done
          echo "Login page did not answer 200 (last: $code)."; exit 1

      - name: Server state after a failed deploy
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "sudo docker ps -a --filter name=filenest --format '{{.Names}}  {{.Status}}'; sudo docker logs --tail 80 filenest-app 2>&1" || true
