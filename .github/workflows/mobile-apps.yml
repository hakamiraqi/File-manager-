name: Apps (Android, iPhone, Windows)

# Builds the Flutter app in mobile/filenest_app for Android (.apk), iPhone (unsigned .ipa) and
# Windows (installer) against https://files.azoclinic.duckdns.org. Builds from main are uploaded
# to the VPS (public/downloads + releases.json) so /download offers them; every run also keeps
# them as workflow artifacts. The apps can be pointed at a local (offline) server from
# "Server settings" inside the app.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-apps.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  API_BASE_URL: https://files.azoclinic.duckdns.org/api/v1
  APP_VERSION: 1.0.${{ github.run_number }}
  BUILD_FLAGS: --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

defaults:
  run:
    working-directory: mobile/filenest_app

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Signing key (the same for every build, so installed apps can update)
        # Kept on the VPS, outside the repo; the first run creates it there.
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::No VPS_SSH_KEY: the APK is signed with a throwaway debug key."; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          vps() { ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "$@"; }
          dir='~/filenest-android-signing'
          if ! vps "test -s $dir/release.jks && test -s $dir/password"; then
            pass=$(openssl rand -hex 16)
            keytool -genkeypair -keystore new.jks -alias filenest -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=FileNest, O=FileNest"
            vps "mkdir -p $dir && chmod 700 $dir && test -s $dir/release.jks || { cat > $dir/release.jks.tmp && printf %s '$pass' > $dir/password && mv $dir/release.jks.tmp $dir/release.jks && chmod 600 $dir/*; }" < new.jks
            rm -f new.jks
          fi
          vps "cat $dir/release.jks" > android/app/release.jks
          pass=$(vps "cat $dir/password")
          echo "::add-mask::$pass"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=filenest\nstoreFile=release.jks\n' "$pass" "$pass" > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release $BUILD_FLAGS --dart-define=API_BASE_URL=$API_BASE_URL
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../../FileNest-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: FileNest-android.apk

  ios:
    # Unsigned .ipa (no Apple Developer account): install with Sideloadly / AltStore.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign $BUILD_FLAGS --dart-define=API_BASE_URL=$API_BASE_URL
      - name: Package unsigned .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr ../../../../FileNest-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: FileNest-ios-unsigned.ipa

  windows:
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release ${{ env.BUILD_FLAGS }} --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Bundle the Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($d in 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" build\windows\x64\runner\Release\ -Force
          }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\setup.iss "/DMyAppVersion=$env:APP_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          Copy-Item "build\windows\installer\FileNestSetup-$env:APP_VERSION.exe" ..\..\FileNest-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: FileNest-windows-setup.exe

  # Puts the new builds on the live server for /download. A platform whose build failed keeps
  # its previous entry in releases.json.
  publish:
    needs: [android, ios, windows]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      APP_DIR: /home/ubuntu/filenest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Name the files and write the manifest
        run: |
          V=$APP_VERSION
          mkdir -p out
          echo '{}' > out/new.json
          add() { jq --arg p "$1" --arg v "$V" --arg url "/downloads/$2" '.[$p] = {version: $v, url: $url}' out/new.json > out/t.json && mv out/t.json out/new.json; }
          [ -f dist/FileNest-android.apk ] && { cp dist/FileNest-android.apk out/FileNest-$V.apk; add android FileNest-$V.apk; }
          [ -f dist/FileNest-ios-unsigned.ipa ] && { cp dist/FileNest-ios-unsigned.ipa out/FileNest-$V.ipa; add ios FileNest-$V.ipa; }
          [ -f dist/FileNest-windows-setup.exe ] && { cp dist/FileNest-windows-setup.exe out/FileNestSetup-$V.exe; add windows FileNestSetup-$V.exe; }
          cat out/new.json
          [ "$(jq length out/new.json)" -gt 0 ] || { echo "No build to publish."; exit 1; }
      - name: Upload to the VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Secret VPS_SSH_KEY is not set."; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          vps() { ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "$@"; }
          dir="$APP_DIR/public/downloads"
          vps "mkdir -p '$dir' && (cat '$dir/releases.json' 2>/dev/null || echo '{}')" > out/old.json
          jq -s '.[0] * .[1]' out/old.json out/new.json > out/releases.json
          (cd out && tar czf - FileNest*) | vps "tar xzf - -C '$dir'"
          vps "cat > '$dir/releases.json.tmp' && mv '$dir/releases.json.tmp' '$dir/releases.json'" < out/releases.json
          # Remove older app builds the manifest no longer points at (the offline server zip has its own entry).
          keep=" $(jq -r '.[] | .url' out/releases.json | xargs -n1 basename | tr '\n' ' ')"
          vps "cd '$dir' && for f in FileNest-1.0.* FileNestSetup-1.0.*; do [ -e \"\$f\" ] || continue; case '$keep' in *\" \$f \"*) ;; *) rm -f -- \"\$f\";; esac; done; ls -la"
      # The offline server carries the apps too (apps/ on the LAN), so rebuild it with the new versions.
      - name: Rebuild the offline server with the new apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run offline-windows.yml --repo "${{ github.repository }}" --ref main || true
