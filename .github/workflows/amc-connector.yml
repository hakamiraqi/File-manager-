# The AMC connector: build its image and run the real Auto Multiple Choice end to end (sheets →
# filled scans → marks). The VPS deploy (deploy-exams.yml) builds and runs the same image.
name: AMC connector

on:
  push:
    branches: [exams]
    paths: ['amc-connector/**', '.github/workflows/amc-connector.yml']
  workflow_dispatch:

concurrency:
  group: amc-connector
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t examnest-amc:test amc-connector
      - name: Start it
        run: |
          docker run -d --name amc -e AMC_TOKEN=test-token -p 8080:8080 examnest-amc:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/health && break; sleep 2; done
      - name: AMC's own options for the commands used
        continue-on-error: true
        run: |
          for c in prepare meptex getimages analyse note association-auto export; do
            echo "=== $c"; docker exec amc sh -c "f=\$(find /usr/libexec/AMC /usr/lib/AMC -name 'AMC-$c.pl' 2>/dev/null | head -1); grep -A45 'GetOptions' \$f | head -60" || true
          done
      - name: How AMC-TXT sets up Arabic
        continue-on-error: true
        run: |
          docker exec amc sh -c 'f=/usr/share/perl5/AMC/Filter/plain.pm; sed -n 40,135p $f; grep -n -i "preambule\|latex =>\|{latex}" $f | head'
          docker exec amc sh -c 'fc-list : family | sort -u | head -60'
      - name: End to end
        env:
          AMC_TOKEN: test-token
        run: |
          pip install --quiet pillow
          python3 amc-connector/test/e2e.py
      - name: Font variants
        if: always()
        env:
          AMC_TOKEN: test-token
        run: python3 amc-connector/test/fonts.py || true
      - name: Picture of the first sheet page
        if: always()
        run: |
          docker exec amc sh -c 'pdftoppm -r 110 -png -f 1 -l 2 /data/e2etest/subject.pdf /tmp/look' || true
          docker cp amc:/tmp/look-1.png look-1.png || docker cp amc:/tmp/look-01.png look-1.png || true
          docker cp amc:/tmp/look-2.png look-2.png || docker cp amc:/tmp/look-02.png look-2.png || true
          for v in a b c d; do docker exec amc sh -c "pdftoppm -r 110 -png -f 1 -l 1 /data/font$v/subject.pdf /tmp/font$v" || true; docker cp amc:/tmp/font$v-1.png look-font$v.png || docker cp amc:/tmp/font$v-01.png look-font$v.png || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amc-look
          path: look-*.png
          if-no-files-found: ignore
      - name: Logs
        if: always()
        run: |
          docker exec amc sh -c 'cat /data/e2etest/amc.log 2>/dev/null | tail -300' || true
          docker logs amc 2>&1 | tail -50 || true
