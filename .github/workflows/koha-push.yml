name: Push books to Koha (one-off)
on:
  push:
    branches: [claude/project-thread-vapo01]
    paths: [ops/koha-push/run.json]
concurrency:
  group: koha-push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pymarc requests
      - env:
          KOHA_USER: ${{ secrets.KOHA_USER }}
          KOHA_PASS: ${{ secrets.KOHA_PASS }}
        run: |
          [ -n "$KOHA_USER" ] && [ -n "$KOHA_PASS" ] || { echo "::error::Add the KOHA_USER and KOHA_PASS secrets first."; exit 1; }
          python3 ops/koha-push/push.py
