name: Docker image check

# Builds the VPS images on branches and pull requests (no push, no deploy), so a broken
# Dockerfile or package name shows up before it reaches main and the live site.
on:
  pull_request:
  push:
    branches-ignore: [main]
    paths:
      - 'deploy/**'
      - 'composer.*'
      - 'package*.json'
      - 'resources/**'
      - 'app/**'
      - 'routes/**'
      - 'tests/**'
      - 'lang/**'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app and web images
        run: |
          docker build -f deploy/vps/Dockerfile --target app -t filenest-app:ci .
          docker build -f deploy/vps/Dockerfile --target web -t filenest-web:ci .
      - name: Tools inside the image
        run: |
          docker run --rm --entrypoint sh filenest-app:ci -c 'php -v | head -1; which ffmpeg pdftotext soffice; fc-list :lang=ar family | head -3'
          printf 'مرحبا بالعالم\nسطر ثاني\n' > /tmp/t.txt
          docker run --rm --entrypoint sh -v /tmp:/w filenest-app:ci -c 'cd /tmp && HOME=/tmp soffice --headless --convert-to pdf --outdir /tmp /w/t.txt >/dev/null && pdftotext -enc UTF-8 /tmp/t.pdf - | head -3'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          # The app reads settings from the database at boot, so give it SQLite before composer's scripts run.
          cp .env.example .env
          sed -i -E 's/^#? *DB_CONNECTION=.*/DB_CONNECTION=sqlite/; s/^#? *DB_(HOST|PORT|DATABASE|USERNAME|PASSWORD)=.*//' .env
          touch database/database.sqlite
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate
          npm ci --no-audit --no-fund && npx vite build
      - name: Text recognition tools (for the real-engine OCR test)
        timeout-minutes: 6
        continue-on-error: true
        # Retried, and not fatal: when Ubuntu's mirrors are unreachable the real-engine OCR tests
        # skip themselves instead of blocking every other test.
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ara poppler-utils qpdf >/dev/null && exit 0
            echo "apt attempt $i failed"; sleep 20
          done
          echo "::warning::Tesseract could not be installed; the real-engine OCR tests will be skipped.
      - name: Guest landing and smoke tests
        run: php artisan test --filter='GuestLandingTest|Thesis|ExampleTest|AssignedFoldersTest|GoldenPathTest|Library|StaffAnalytics|OfflineActivation|ProfileAvatar|ProfileTest|SavedItems|ActivityLogPage|UserStatus|LanguagesTest|NotificationsTest|PublicSiteTest|MobileFeaturesApiTest|OcrTest|OfflineExportTest|ThumbnailTest'
