name: Offline server (Windows)

# Builds a self-contained Windows folder of the whole site (PHP, MariaDB, Caddy, CoreDNS,
# cloudflared, the app with vendor/ and built assets, plus the Windows/Android/iPhone apps) that
# runs on one computer with no internet, run by the FileNest.exe control panel (the same panel as
# the clinic system's offline server). See offline/README.md. A Windows runner starts it and checks
# it before anything is published. Builds from main go to /download on the VPS, with
# downloads/offline-latest.json for the panels' updates.
on:
  push:
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'lang/**'
      - 'resources/**'
      - 'routes/**'
      - 'public/**'
      - 'composer.*'
      - 'package*.json'
      - 'offline/**'
      - '.github/workflows/offline-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PHP_MINOR: '8.4'
  MARIADB_VERSION: '10.11.10'
  CADDY_VERSION: '2.8.4'
  COREDNS_VERSION: '1.12.3'
  CLOUDFLARED_VERSION: '2026.9.3'
  TESSERACT_VERSION: '5.4.0.20240606'
  POPPLER_VERSION: '24.08.0-0'
  SITE: https://files.azoclinic.duckdns.org

jobs:
  panel:
    # The control panel (FileNest.exe), compiled with the .NET Framework compiler that ships with Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile FileNest.exe
        shell: pwsh
        working-directory: offline/windows/panel
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /codepage:65001 /optimize+ `
            /out:FileNest.exe /win32icon:icon.ico /win32manifest:app.manifest `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Management.dll /r:System.Core.dll `
            /r:System.Web.Extensions.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll FileNest.cs
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: panel
          path: offline/windows/panel/FileNest.exe
          retention-days: 3
      # Pictures of every page of the panel, to check the look and that nothing is cut off.
      - name: Pictures of the panel
        shell: pwsh
        working-directory: offline/windows/panel
        run: |
          Copy-Item ..\config.txt .\config.txt
          $p = Start-Process -FilePath .\FileNest.exe -ArgumentList '--screenshots','shots' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'The screenshots did not finish.' }
          Get-ChildItem shots | Format-Table Name,Length | Out-String | Write-Host
          if (Test-Path shots\errors.txt) { Get-Content shots\errors.txt; throw 'Some pages failed to draw.' }
          if ((Get-ChildItem shots\*.png).Count -lt 6) { throw 'Pictures are missing.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panel-screens
          path: offline/windows/panel/shots
          retention-days: 7

  package:
    needs: panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: gd, intl, zip, mbstring, pdo_mysql, sodium, fileinfo, exif
          tools: composer
      # --no-scripts: package:discover boots the app, which reads settings from a database the runner lacks.
      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-install=auto --no-scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Everything the pages load is in the package (no CDN)
        run: |
          # Plyr's built-in defaults (cdn.plyr.io) stay in its code but are
          # overridden in PreviewModal.vue, so they are not counted.
          if grep -rEo 'https?://(fonts\.(googleapis|bunny|gstatic)|cdn\.|unpkg\.com|cdnjs\.)[^"'"'"'` ]*' resources/views public/build | grep -v 'cdn\.plyr\.io'; then
            echo "::error::A page loads something from the internet; the offline server must work without it."; exit 1
          fi

      - name: Assemble the app
        run: |
          OUT=dist/FileNestOffline
          mkdir -p $OUT/app
          rsync -a ./ $OUT/app/ \
            --exclude .git --exclude .github --exclude node_modules --exclude mobile --exclude /offline \
            --exclude /deploy --exclude tests --exclude /dist --exclude 'public/downloads' --exclude 'public/hot' \
            --exclude 'public/storage' --exclude '.env' --exclude 'storage/logs/*' --exclude 'storage/app/*' \
            --exclude 'storage/framework/*/*' --exclude 'bootstrap/cache/*.php'
          mkdir -p $OUT/app/storage/app/filemanager $OUT/app/storage/app/public $OUT/app/storage/logs \
            $OUT/app/storage/framework/cache $OUT/app/storage/framework/sessions $OUT/app/storage/framework/views
          cp offline/windows/env.offline $OUT/app/.env.offline
          cp offline/windows/prepare.ps1 offline/windows/config.txt $OUT/
          cp -r offline/windows/setup $OUT/setup
          cp offline/README.md $OUT/README.md
          # The panel compares this with offline-latest.json to offer updates.
          echo ${{ github.run_number }} > $OUT/version.txt
          sed -i 's/\r*$/\r/' $OUT/*.ps1 $OUT/config.txt $OUT/README.md

      - uses: actions/download-artifact@v4
        with:
          name: panel
          path: dist/FileNestOffline

      - name: Apps for phones and computers (served at /apps on the LAN)
        run: |
          OUT=dist/FileNestOffline/apps
          mkdir -p $OUT
          if curl -fsSL --retry 3 "$SITE/downloads/releases.json" -o rel.json; then
            for p in windows android ios; do
              url=$(jq -r --arg p $p '.[$p].url // empty' rel.json)
              [ -n "$url" ] || continue
              curl -fsSL --retry 3 -o "$OUT/$(basename "$url")" "$SITE$url" || true
            done
          fi
          ls -la $OUT

      - name: Windows PHP
        run: |
          OUT=dist/FileNestOffline
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o php-releases.json https://windows.php.net/downloads/releases/releases.json
          VER=$(jq -r --arg m "$PHP_MINOR" '.[$m].version' php-releases.json)
          ZIP=$(jq -r --arg m "$PHP_MINOR" '.[$m] | to_entries[] | select(.key | test("^nts-vs[0-9]+-x64$")) | .value.zip.path' php-releases.json | head -1)
          echo "PHP: $VER ($ZIP)"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o php.zip "https://windows.php.net/downloads/releases/$ZIP"
          mkdir -p $OUT/php && unzip -q php.zip -d $OUT/php
          cat $OUT/php/php.ini-production offline/windows/php.ini.overrides > $OUT/php/php.ini.template
          rm -rf $OUT/php/dev $OUT/php/extras
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $OUT/php/cacert.pem https://curl.se/ca/cacert.pem
          grep -q 'BEGIN CERTIFICATE' $OUT/php/cacert.pem
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $OUT/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      - name: Windows MariaDB
        run: |
          OUT=dist/FileNestOffline
          curl -fsSL --retry 5 --retry-delay 10 -o mariadb.zip "https://archive.mariadb.org/mariadb-${MARIADB_VERSION}/winx64-packages/mariadb-${MARIADB_VERSION}-winx64.zip"
          unzip -q mariadb.zip -d tmpdb
          mv tmpdb/mariadb-* $OUT/mariadb
          rm -rf $OUT/mariadb/mysql-test $OUT/mariadb/sql-bench $OUT/mariadb/include $OUT/mariadb/data
          find $OUT/mariadb -name '*.pdb' -delete
          test -f $OUT/mariadb/bin/mariadbd.exe && test -f $OUT/mariadb/bin/mariadb-install-db.exe

      - name: Caddy (web server), CoreDNS (local name) and cloudflared (online access)
        run: |
          OUT=dist/FileNestOffline
          mkdir -p $OUT/caddy $OUT/coredns $OUT/cloudflared
          curl -fsSL --retry 5 -o caddy.zip "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_windows_amd64.zip"
          unzip -q -o caddy.zip caddy.exe -d $OUT/caddy
          curl -fsSL --retry 5 -o coredns.tgz "https://github.com/coredns/coredns/releases/download/v${COREDNS_VERSION}/coredns_${COREDNS_VERSION}_windows_amd64.tgz"
          tar -xzf coredns.tgz -C $OUT/coredns
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $OUT/cloudflared/cloudflared.exe \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-windows-amd64.exe"
          test -f $OUT/caddy/caddy.exe && test -f $OUT/coredns/coredns.exe && test -f $OUT/FileNest.exe
          test "$(stat -c %s $OUT/cloudflared/cloudflared.exe)" -gt 20000000

      - name: Text recognition (Tesseract with Arabic and English, Poppler for scanned PDFs)
        run: |
          # Bundled so text recognition works without installing anything on the clinic PC.
          OUT=dist/FileNestOffline
          command -v 7z >/dev/null || sudo apt-get install -y p7zip-full >/dev/null
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o tess.exe \
            "https://github.com/UB-Mannheim/tesseract/releases/download/v${TESSERACT_VERSION}/tesseract-ocr-w64-setup-${TESSERACT_VERSION}.exe"
          7z x -y -otess-x tess.exe >/dev/null
          EXE=$(find tess-x -iname tesseract.exe | head -1)
          test -n "$EXE"
          mkdir -p $OUT/tesseract
          cp -r "$(dirname "$EXE")"/. $OUT/tesseract/
          rm -rf "$OUT/tesseract/\$PLUGINSDIR" $OUT/tesseract/*.html $OUT/tesseract/doc $OUT/tesseract/Uninstall* $OUT/tesseract/tessdata/script $OUT/tesseract/tessdata/configs/*.ttf
          mkdir -p $OUT/tesseract/tessdata
          # The most accurate models (tessdata_best) for Arabic and English.
          for l in ara eng osd; do
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $OUT/tesseract/tessdata/$l.traineddata \
              "https://github.com/tesseract-ocr/tessdata_best/raw/main/$l.traineddata"
          done
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o poppler.zip \
            "https://github.com/oschwartz10612/poppler-windows/releases/download/v${POPPLER_VERSION}/Release-${POPPLER_VERSION}.zip"
          unzip -q poppler.zip -d poppler-x
          BIN=$(dirname "$(find poppler-x -iname pdftoppm.exe | head -1)")
          mkdir -p $OUT/poppler && cp -r "$BIN"/. $OUT/poppler/
          test -f $OUT/tesseract/tesseract.exe && test -f $OUT/poppler/pdftoppm.exe
          test "$(stat -c %s $OUT/tesseract/tessdata/ara.traineddata)" -gt 1000000
          du -sh $OUT/tesseract $OUT/poppler

      - name: PDF programs (qpdf, ImageMagick, Ghostscript)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # qpdf lays the recognised text under scanned pages (copyable, searchable PDFs);
          # ImageMagick straightens and cleans the page pictures before recognition.
          # Both are found by the app at ..\qpdf\bin\qpdf.exe and ..\imagemagick\magick.exe.
          OUT=dist/FileNestOffline
          command -v 7z >/dev/null || sudo apt-get install -y p7zip-full >/dev/null
          Q=$(gh release view -R qpdf/qpdf --json assets --jq '.assets[] | select(.name|test("-msvc64\\.zip$")) | .url' | head -1)
          test -n "$Q"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o qpdf.zip "$Q"
          unzip -q qpdf.zip -d qpdf-x
          QB=$(find qpdf-x -iname qpdf.exe | head -1)
          mkdir -p $OUT/qpdf && cp -r "$(dirname "$(dirname "$QB")")"/. $OUT/qpdf/
          test -f $OUT/qpdf/bin/qpdf.exe
          M=$(gh release view -R ImageMagick/ImageMagick --json assets --jq '.assets[] | select(.name|test("portable-Q16-(HDRI-)?x64\\.(zip|7z)$")) | .url' | head -1 || true)
          if [ -z "$M" ]; then
            F=$(curl -fsSL --retry 3 https://imagemagick.org/archive/binaries/ | grep -oE 'ImageMagick-[0-9.]+-[0-9]+-portable-Q16-(HDRI-)?x64\.(zip|7z)' | sort -V | tail -1)
            [ -n "$F" ] && M="https://imagemagick.org/archive/binaries/$F"
          fi
          if [ -n "$M" ]; then
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o "im.${M##*.}" "$M"
            7z x -y -oim-x "im.${M##*.}" >/dev/null
            MB=$(find im-x -iname magick.exe | head -1)
            mkdir -p $OUT/imagemagick && cp -r "$(dirname "$MB")"/. $OUT/imagemagick/
            rm -rf $OUT/imagemagick/www $OUT/imagemagick/images
            test -f $OUT/imagemagick/magick.exe
          else
            echo "::warning::No portable ImageMagick found; the package recognises pages without cleanup."
          fi
          du -sh $OUT/qpdf $OUT/imagemagick 2>/dev/null || true
          # Ghostscript: «ضغط PDF» in the PDF tools (the NSIS installer unpacks with 7-Zip).
          G=$(gh release view -R ArtifexSoftware/ghostpdl-downloads --json assets --jq '.assets[] | select(.name|test("^gs[0-9]+w64\\.exe$")) | .url' | head -1 || true)
          if [ -n "$G" ]; then
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o gs.exe "$G"
            7z x -y -ogs-x gs.exe >/dev/null
            GB=$(find gs-x -iname gswin64c.exe | head -1)
            mkdir -p $OUT/ghostscript && cp -r "$(dirname "$(dirname "$GB")")"/. $OUT/ghostscript/
            rm -rf "$OUT/ghostscript/\$PLUGINSDIR" $OUT/ghostscript/doc $OUT/ghostscript/examples $OUT/ghostscript/uninstgs.exe*
            test -f $OUT/ghostscript/bin/gswin64c.exe
          else
            echo "::warning::No Ghostscript release found; «compress» uses qpdf only on the offline server."
          fi
          du -sh $OUT/ghostscript 2>/dev/null || true
          # ffmpeg (2026-11-13): video pictures and the lower qualities («الجودة» in the player).
          # Found by the app at ..\ffmpeg\bin\ffmpeg.exe; only ffmpeg.exe and its DLLs are kept.
          F=$(gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[] | select(.name|test("^ffmpeg-n[0-9.]+-latest-win64-gpl-shared-[0-9.]+\\.zip$")) | .url' | sort -V | tail -1 || true)
          if [ -n "$F" ]; then
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o ffmpeg.zip "$F"
            unzip -q ffmpeg.zip -d ffmpeg-x
            FB=$(find ffmpeg-x -iname ffmpeg.exe | head -1)
            mkdir -p $OUT/ffmpeg/bin && cp "$FB" "$(dirname "$FB")"/*.dll $OUT/ffmpeg/bin/
            test -f $OUT/ffmpeg/bin/ffmpeg.exe
          else
            echo "::warning::No ffmpeg build found; videos play in their original quality only on the offline server."
          fi
          du -sh $OUT/ffmpeg 2>/dev/null || true

      - name: Zip
        run: |
          cd dist && zip -qr9 ../FileNestOffline-windows.zip FileNestOffline
          ls -la ../FileNestOffline-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: offline
          path: FileNestOffline-windows.zip
          retention-days: 14

  smoke-test:
    # Unzip on a real Windows machine, start it through the panel and check it, so a broken package
    # is never published.
    needs: package
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline
      - name: Start through FileNest.exe and check the site
        shell: pwsh
        run: |
          # The checks below run without activation; the next step checks the gate itself.
          $env:OFFLINE_ACTIVATION = 'false'
          Expand-Archive FileNestOffline-windows.zip -DestinationPath C:\
          $root = 'C:\FileNestOffline'
          # Port 80 is reserved on the runner; exercise the port settings instead.
          (Get-Content "$root\config.txt") -replace '^HTTP_PORT=80$', 'HTTP_PORT=8080' -replace '^HTTPS_PORT=443$', 'HTTPS_PORT=8443' | Set-Content "$root\config.txt"
          Start-Process -FilePath "$root\FileNest.exe" -ArgumentList '--headless' -WorkingDirectory $root
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 5
            $ok = (curl.exe -s -o NUL -w '%{http_code}' --max-time 10 http://127.0.0.1:8080/login) -eq '200'
          }
          Write-Host '== panel.log'; Get-Content "$root\app\storage\logs\panel.log" -Encoding UTF8 -ErrorAction SilentlyContinue | Select-Object -Last 40
          if (-not $ok) {
            Get-ChildItem "$root\app\storage\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 40 }
            Write-Host '== Caddyfile'; Get-Content "$root\Caddyfile" -ErrorAction SilentlyContinue
            Write-Host '== caddy validate'; & "$root\caddy\caddy.exe" validate --config "$root\Caddyfile" --adapter caddyfile 2>&1 | Select-Object -Last 10
            Write-Host '== processes'; Get-Process php*,caddy,coredns,mariadbd -ErrorAction SilentlyContinue | Format-Table Name,Id,Path | Out-String | Write-Host
            throw 'The offline server did not serve the login page.'
          }
          $admin = & "$root\mariadb\bin\mariadb.exe" --user=root --host=127.0.0.1 --port=3308 -N -e "select email from filenest.users where email='admin@filenest.test'"
          if ($admin -ne 'admin@filenest.test') { throw 'The admin account was not created.' }

          Write-Host 'Text recognition:'
          $langs = & "$root\tesseract\tesseract.exe" --list-langs 2>&1 | Out-String
          Write-Host $langs
          if ($langs -notmatch '(?m)^ara\s*$') { throw 'Tesseract or its Arabic model is missing.' }
          & "$root\poppler\pdftoppm.exe" -v 2>&1 | Select-Object -First 1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'pdftoppm does not start.' }
          & "$root\qpdf\bin\qpdf.exe" --version 2>&1 | Select-Object -First 1 | Write-Host
          if ($LASTEXITCODE -ne 0) { throw 'qpdf does not start.' }
          Write-Host 'PDF tools:'
          Push-Location "$root\app"
          & "$root\php\php.exe" -c "$root\php\php.ini" artisan pdf:selftest --require=merge,split,organize,rotate,compress,protect,unlock,numbers,to_images,to_text,watermark,images_to_pdf,crop,redact,repair,remove_blank,extract_images,header_footer,to_excel,to_pptx 2>&1 | Write-Host
          $pdfOk = $LASTEXITCODE
          Pop-Location
          if ($pdfOk -ne 0) { throw 'A PDF tool does not work on Windows.' }
          if (Test-Path "$root\imagemagick\magick.exe") {
            & "$root\imagemagick\magick.exe" -version 2>&1 | Select-Object -First 1 | Write-Host
            if ($LASTEXITCODE -ne 0) { throw 'ImageMagick does not start.' }
          }
          if (Test-Path "$root\ffmpeg\bin\ffmpeg.exe") {
            & "$root\ffmpeg\bin\ffmpeg.exe" -hide_banner -version 2>&1 | Select-Object -First 1 | Write-Host
            if ($LASTEXITCODE -ne 0) { throw 'ffmpeg does not start.' }
            Push-Location "$root\app"
            $found = & "$root\php\php.exe" -c "$root\php\php.ini" -r "require 'vendor/autoload.php'; `$a = require 'bootstrap/app.php'; `$a->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo App\Support\Ffmpeg::binary() ?: 'none';"
            Pop-Location
            Write-Host "ffmpeg for the app: $found"
            if ("$found" -notmatch 'ffmpeg\.exe') { throw 'The app does not find ffmpeg.' }
          }
          Push-Location "$root\app"
          & "$root\php\php.exe" -c "$root\php\php.ini" artisan ocr:run --force --batch=1 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw 'ocr:run failed.' }
          Pop-Location

          Write-Host 'DNS:'
          $dns = Resolve-DnsName -Name files.lan -Server 127.0.0.1 -DnsOnly -Type A
          if (-not $dns.IPAddress) { throw 'files.lan did not resolve.' }

          $ip = (Get-Content "$root\lan-ip.txt").Trim()
          Write-Host "LAN IP: $ip"
          foreach ($path in '/login', '/download', '/up', '/build/manifest.json', '/brand.json', '/favicon.svg') {
            $code = curl.exe -s -o NUL -w '%{http_code}' --max-time 30 "http://${ip}:8080$path"
            Write-Host "$path -> $code"
            if ($code -ne '200') { throw "$path answered $code on the LAN address" }
          }
          $https = curl.exe -sk -o NUL -w '%{http_code}' --max-time 30 "https://${ip}:8443/login"
          if ($https -ne '200') { throw "HTTPS login page failed ($https)." }
          $ca = Invoke-WebRequest -Uri "http://${ip}:8080/ca.crt" -UseBasicParsing -TimeoutSec 30
          if ($ca.StatusCode -ne 200 -or $ca.RawContentLength -lt 300) { throw 'Certificate download failed.' }
          $setup = Invoke-WebRequest -Uri "http://${ip}:8080/setup" -UseBasicParsing -TimeoutSec 30
          if ($setup.Content -notmatch 'cert.html') { throw 'Setup page failed.' }
          $apps = curl.exe -s -o NUL -w '%{http_code}' --max-time 30 "http://${ip}:8080/apps/"
          Write-Host "/apps/ -> $apps"

          Write-Host 'API login (the apps use it)'
          $body = '{"email":"admin@filenest.test","password":"password","device_name":"ci"}'
          $login = curl.exe -s --max-time 30 -H 'Content-Type: application/json' -H 'Accept: application/json' -d $body "http://${ip}:8080/api/v1/auth/login"
          if (($login -join '') -notmatch 'token') { Write-Host '::warning::API login did not return a token.' }

          Write-Host 'Backup now (the panel button runs this)'
          & "$root\php\php.exe" -c "$root\php\php.ini" "$root\app\artisan" backup:run --force
          if ($LASTEXITCODE -ne 0) { throw 'backup:run failed.' }
          if (-not (Get-ChildItem C:\FileNestBackups\*.zip -ErrorAction SilentlyContinue)) { throw 'No backup zip was made in C:\FileNestBackups.' }

          Write-Host 'Self-healing: kill the web server, the panel must restart it'
          Get-Process caddy | Stop-Process -Force
          Start-Sleep -Seconds 15
          $back = curl.exe -s -o NUL -w '%{http_code}' --max-time 30 http://127.0.0.1:8080/login
          if ($back -ne '200') { throw "The web server was not restarted, got $back" }

          Start-Process -FilePath "$root\FileNest.exe" -ArgumentList '--stop' -Wait
          Start-Sleep -Seconds 3
          $left = Get-Process php-cgi, php, caddy, mariadbd, coredns -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$root*" }
          if ($left) { $left | Format-Table Name, Id | Out-String | Write-Host; throw 'Processes were left running after --stop.' }

      - name: Without an activation code every page leads to the activation page
        shell: pwsh
        run: |
          $root = 'C:\FileNestOffline'
          Start-Process -FilePath "$root\FileNest.exe" -ArgumentList '--headless' -WorkingDirectory $root
          $code = ''
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 5
            $code = curl.exe -s -o NUL -w '%{http_code} %{redirect_url}' --max-time 10 http://127.0.0.1:8080/login
            if ($code -match '^30') { break }
          }
          Write-Host "login: $code"
          if ($code -notmatch '^302 .*/activate$') { Get-Content "$root\app\storage\logs\panel.log" -Encoding UTF8 -Tail 30; throw "Before activation /login should lead to /activate, got $code" }
          $page = Invoke-WebRequest -Uri http://127.0.0.1:8080/activate -UseBasicParsing -TimeoutSec 30
          if ($page.Content -notmatch '[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}') { throw 'The activation page does not show the machine id.' }
          & "$root\php\php.exe" -r "exit(function_exists('sodium_crypto_sign_verify_detached') ? 0 : 1);"
          if ($LASTEXITCODE -ne 0) { throw 'sodium is missing from the bundled PHP.' }
          # Activation calls the licensing server over HTTPS; this fails without a CA list.
          & "$root\php\php.exe" -c "$root\php\php.ini" -r "`$c = curl_init('https://dental.azoclinic.duckdns.org/up'); curl_setopt(`$c, CURLOPT_RETURNTRANSFER, true); curl_setopt(`$c, CURLOPT_NOBODY, true); curl_exec(`$c); `$e = curl_error(`$c); echo `$e; exit(`$e === '' ? 0 : 1);"
          if ($LASTEXITCODE -ne 0) { throw 'The bundled PHP cannot make HTTPS calls (activation would fail).' }
          Start-Process -FilePath "$root\FileNest.exe" -ArgumentList '--stop' -Wait

  publish:
    needs: smoke-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_DIR: /home/ubuntu/filenest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline
      - name: Upload to the VPS (/download)
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Secret VPS_SSH_KEY is not set."; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          vps() { ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "$@"; }
          N=${{ github.run_number }}
          f=FileNestOffline-$N.zip
          dir="$APP_DIR/public/downloads"
          vps "mkdir -p '$dir' && chmod 755 '$dir' && cat > '$dir/$f.tmp' && mv '$dir/$f.tmp' '$dir/$f' && chmod 644 '$dir/$f'" < FileNestOffline-windows.zip
          # The VPS has python3 (no jq): merge the offline entry into releases.json.
          # The panels' update manifest: build, url, size and SHA-256 of the package.
          printf '{"build": %s, "url": "/downloads/%s", "size": %s, "sha256": "%s"}\n' $N $f $(stat -c %s FileNestOffline-windows.zip) $(sha256sum FileNestOffline-windows.zip | cut -d' ' -f1) > offline-latest.json
          cat offline-latest.json
          vps "cat > '$dir/offline-latest.json.tmp' && mv '$dir/offline-latest.json.tmp' '$dir/offline-latest.json' && chmod 644 '$dir/offline-latest.json'" < offline-latest.json
          vps "cd '$dir' && python3 -c \"import json,os; p='releases.json'; d=json.load(open(p)) if os.path.exists(p) else {}; d['offline_server']={'version':'$N','url':'/downloads/$f'}; json.dump(d,open(p+'.tmp','w'),indent=2); os.replace(p+'.tmp',p)\" \
            && for o in FileNestOffline-*.zip; do [ \"\$o\" = '$f' ] || rm -f -- \"\$o\"; done; cat releases.json; ls -la"

  office-addon:
    # The optional office editor for the offline server (ONLYOFFICE Docs Community with its
    # Erlang/RabbitMQ/PostgreSQL prerequisites), as its own zip: it is large and needs an
    # administrator install, so it is not part of the portable package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the installers
        run: |
          OUT=dist/office-addon
          mkdir -p $OUT
          cp offline/windows/office-addon/install-office.ps1 offline/windows/office-addon/install-office.cmd $OUT/
          for f in onlyoffice-documentserver-prerequisites.exe onlyoffice-documentserver.exe; do
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o $OUT/$f \
              "https://download.onlyoffice.com/install/documentserver/windows/$f"
            test "$(stat -c %s $OUT/$f)" -gt 10000000
          done
          ls -la $OUT
          cd dist && zip -qr0 ../FileNestOffice-addon-windows.zip office-addon
      - uses: actions/upload-artifact@v4
        with:
          name: office-addon
          path: FileNestOffice-addon-windows.zip
          retention-days: 14

  office-addon-test:
    # Installs the add-on on a real Windows machine next to a stand-in FileNest folder and
    # checks that the editor answers and that app\.env got its settings.
    needs: office-addon
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: office-addon
      - name: Install and check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\FN\app | Out-Null
          Set-Content C:\FN\app\.env "APP_NAME=FileNest`nONLYOFFICE_JWT_SECRET=old" -Encoding UTF8
          Set-Content C:\FN\config.txt "HTTP_PORT=80" -Encoding ASCII
          Expand-Archive FileNestOffice-addon-windows.zip -DestinationPath C:\FN
          & powershell -NoProfile -ExecutionPolicy Bypass -File C:\FN\office-addon\install-office.ps1
          if ($LASTEXITCODE -ne 0) { throw 'install-office.ps1 failed.' }
          $h = (Invoke-WebRequest http://127.0.0.1:8088/healthcheck -UseBasicParsing -TimeoutSec 30).Content
          Write-Host "healthcheck: $h"
          if ($h -notmatch 'true') { throw 'ONLYOFFICE does not answer.' }
          $api = Invoke-WebRequest http://127.0.0.1:8088/web-apps/apps/api/documents/api.js -UseBasicParsing -TimeoutSec 30
          if ($api.StatusCode -ne 200) { throw 'api.js is not served.' }
          $envText = Get-Content C:\FN\app\.env -Raw
          Write-Host ($envText -replace 'SECRET=.*', 'SECRET=***')
          if ($envText -notmatch '(?m)^ONLYOFFICE_JWT_SECRET=[A-Za-z0-9]{16,}') { throw 'The signing key was not written.' }
          if ($envText -match '(?m)^ONLYOFFICE_JWT_SECRET=old') { throw 'The old key was kept.' }
          if ($envText -notmatch '(?m)^ONLYOFFICE_INTERNAL_URL=http://127.0.0.1:8088') { throw 'The editor address was not written.' }

  office-addon-publish:
    needs: office-addon-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_DIR: /home/ubuntu/filenest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: office-addon
      - name: Upload to the VPS (/downloads/FileNestOffice-addon-windows.zip) when it changed
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '193.123.83.82' }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Secret VPS_SSH_KEY is not set."; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          vps() { ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "$@"; }
          f=FileNestOffice-addon-windows.zip
          dir="$APP_DIR/public/downloads"
          sum=$(sha256sum $f | cut -d' ' -f1)
          if [ "$(vps "cat '$dir/$f.sha256' 2>/dev/null")" = "$sum" ]; then echo "Unchanged."; exit 0; fi
          vps "mkdir -p '$dir' && cat > '$dir/$f.tmp' && mv '$dir/$f.tmp' '$dir/$f' && chmod 644 '$dir/$f' && echo $sum > '$dir/$f.sha256'" < $f
          vps "cd '$dir' && python3 -c \"import json,os; p='releases.json'; d=json.load(open(p)) if os.path.exists(p) else {}; d['offline_office_addon']={'url':'/downloads/$f','sha256':'$sum'}; json.dump(d,open(p+'.tmp','w'),indent=2); os.replace(p+'.tmp',p)\""
